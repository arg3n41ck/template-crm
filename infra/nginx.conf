server {
    listen 80;
    server_name localhost;

    # Define the root directory where the static files are located
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Settings for better performance
    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/vnd.ms-fontobject image/svg+xml;

    # Serve static files and handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
